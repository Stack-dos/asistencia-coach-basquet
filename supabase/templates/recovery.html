<h2>Recuperá tu contraseña</h2>
<p>Recibimos un pedido para cambiar la contraseña de tu cuenta.</p>
<p>Para elegir una contraseña nueva, hacé clic en el siguiente enlace:</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
    >Cambiar mi contraseña</a
  >
</p>
<p>Si no lo pediste vos, ignorá este email: tu contraseña no cambia.</p>
