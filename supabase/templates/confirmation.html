<h2>Confirmá tu cuenta</h2>
<p>Hola, gracias por registrarte en Asistencia a Entrenamientos.</p>
<p>Para activar tu cuenta, hacé clic en el siguiente enlace:</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
    >Confirmar mi cuenta</a
  >
</p>
<p>Si no creaste esta cuenta, ignorá este email.</p>
