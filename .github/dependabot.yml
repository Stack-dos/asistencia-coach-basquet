# Dependabot abre PRs para actualizar dependencias. Cada PR pasa por el CI antes de mergear.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Un solo PR por semana con todas las minor/patch; las major vienen sueltas (pueden romper).
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
